<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CLU Latent documentation and contribution overview</title>
<desc id="desc">Documentation links and contribution expectations for the public repository.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <style>
    .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:800;fill:#07182f}
    .body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#17324f}
    .small{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#38536f}
    .label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:700;fill:#0d2a50}
  </style>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="800" y="100" class="title" font-size="72" text-anchor="middle">Build with CLU Latent</text>
<text x="800" y="150" class="body" font-size="28" text-anchor="middle">Public V1 documentation, examples, tests, and contribution paths</text>
<g transform="translate(75 205)">
  <g><rect x="0" y="0" width="700" height="535" rx="30" fill="white"/><rect x="750" y="0" width="700" height="535" rx="30" fill="white"/></g>
  <text x="55" y="75" class="title" font-size="43">Documentation</text>
  <text x="805" y="75" class="title" font-size="43">Contribute</text>
  <g class="label" font-size="28"><text x="70" y="150">Quickstart</text><text x="70" y="230">V1 format and compatibility</text><text x="70" y="310">Archive and security model</text><text x="70" y="390">CLI and Python API</text><text x="70" y="470">Examples and conformance</text></g>
  <g class="small" font-size="21"><text x="70" y="180">Install, build, open, and inspect a package.</text><text x="70" y="260">Stable profile rules and compatibility commitments.</text><text x="70" y="340">Bounded extraction, verification, and threat model.</text><text x="70" y="420">Commands and package-reader integration.</text><text x="70" y="500">Synthetic fixtures and offline validation.</text></g>
  <g class="label" font-size="28"><text x="820" y="150">Issues, ideas, and pull requests welcome</text><text x="820" y="235">Use safe fixtures</text><text x="820" y="320">Protect the compatibility boundary</text><text x="820" y="405">Prove changes with tests</text></g>
  <g class="small" font-size="21"><text x="820" y="180">Start with a reproducible problem or bounded improvement.</text><text x="820" y="265">Synthetic or clearly redistributable media only.</text><text x="820" y="350">Profile, manifest, archive, and API changes need care.</text><text x="820" y="435">Focused tests and documentation are required.</text></g>
  <rect x="820" y="468" width="560" height="54" rx="14" fill="url(#blue)"/>
  <text x="1100" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-weight="700" font-size="23" fill="white" text-anchor="middle">github.com/DOGESON-j/clu-latent</text>
</g>
<g transform="translate(75 785)">
  <rect width="1450" height="72" rx="20" fill="#0d2a50"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-weight="700" font-size="23" fill="white" text-anchor="middle"><text x="210" y="45">Public release v1.0.0</text><text x="560" y="45">Python 3.10+</text><text x="890" y="45">BSD-3-Clause</text><text x="1240" y="45">Local-first</text></g>
</g>
</svg>
