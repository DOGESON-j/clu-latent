name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[visual,dev,api]"
      - run: python -m pytest -q
      - run: clulatent conformance run

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: clulatent --version
      - run: clulatent conformance run

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke wheel
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          /tmp/wheel-smoke/bin/clulatent --version
          /tmp/wheel-smoke/bin/clulatent conformance run
          /tmp/wheel-smoke/bin/clulatent demo --no-browser
      - name: Smoke sdist
        run: |
          python -m venv /tmp/sdist-smoke
          /tmp/sdist-smoke/bin/pip install dist/*.tar.gz
          /tmp/sdist-smoke/bin/clulatent --version
          /tmp/sdist-smoke/bin/clulatent conformance run
          /tmp/sdist-smoke/bin/clulatent demo --no-browser
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
